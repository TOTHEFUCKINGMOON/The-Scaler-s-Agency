    <script>
        // --- 1. ANIMATION DES PARTICULES (Électrons & Icônes) ---
        const canvas = document.getElementById('particle-canvas');

        const mouse = { x: null, y: null, radius: 250 };
        
        const gadsImg = new Image();
        gadsImg.src = 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Google_Ads_logo.svg';
        
        const ytImg = new Image();
        ytImg.src = 'https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg';

        function resize() {
            const scale = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * scale;
            canvas.height = window.innerHeight * scale;
            ctx.scale(scale, scale);
            initParticles();
        }

        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });

        class Particle {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.angle = Math.random() * Math.PI * 2;
                
                let rand = Math.random();
                if (rand > 0.96) {
                    this.type = 'yt';
                    this.size = Math.random() * 8 + 12; 
                } else if (rand > 0.92) {
                    this.type = 'gads';
                    this.size = Math.random() * 8 + 12;
                } else {
                    this.type = 'electron';
                    this.size = Math.random() * 1.5 + 0.2;
                }
            }
            update() {
                let dxC = (window.innerWidth / 2) - this.x;
                let dyC = (window.innerHeight / 2) - this.y;
                let distC = Math.sqrt(dxC*dxC + dyC*dyC);
                
                if (distC < 500) {
                    this.angle += 0.0008;
                    this.x += Math.cos(this.angle) * 0.12;
                    this.y += Math.sin(this.angle) * 0.12;
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > window.innerWidth) this.vx *= -1;
                if (this.y < 0 || this.y > window.innerHeight) this.vy *= -1;

                if (mouse.x) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < mouse.radius) {
                        let force = (mouse.radius - dist) / mouse.radius;
                        this.x -= dx * force * 0.03;
                        this.y -= dy * force * 0.03;
                    }
                }
            }
            draw() {
                if (this.type === 'electron') {
                    ctx.fillStyle = 'rgba(255, 0, 255, 1.0)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    let img = this.type === 'gads' ? gadsImg : ytImg;
                    if (img.complete) {
                        ctx.globalAlpha = 0.8;
                        ctx.drawImage(img, this.x - this.size/2, this.y - this.size/2, this.size, this.size);
                        ctx.globalAlpha = 1.0;
                    }
                }
            }
        }

        function initParticles() {
            particles = [];
            const count = (window.innerWidth * window.innerHeight) / 9000;
            for (let i = 0; i < count; i++) particles.push(new Particle());
        }

        function drawLines() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i; j < particles.length; j++) {
                    if (particles[i].type !== 'electron' || particles[j].type !== 'electron') continue;
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 110) {
                        let opacity = (1 - (dist / 110)) * 0.3;
                        ctx.strokeStyle = `rgba(255, 0, 255, ${opacity})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            particles.forEach(p => { p.update(); p.draw(); });
            drawLines();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
